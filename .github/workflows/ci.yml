name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check bridge tests
      - run: pytest -q
      - name: Validar scripts
        run: bash -n scripts/*.sh
      - name: Validar Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Construir bridge e worker
        run: docker compose build bridge bridge-worker
